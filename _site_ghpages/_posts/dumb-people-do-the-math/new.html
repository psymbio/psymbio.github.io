<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Carryover Addition</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .input-container {
            margin-bottom: 20px;
        }
        .input-container label {
            margin-right: 10px;
        }
        .input-container input {
            padding: 5px;
            font-size: 1em;
        }
        .addition-table {
            border-collapse: collapse;
            margin: 20px 0;
        }
        .addition-table td {
            border: 1px solid #000;
            padding: 10px;
            text-align: center;
        }
        .carryover {
            color: red;
            font-weight: bold;
        }
        .digit {
            font-size: 1.2em;
        }
        .result {
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<h1>Dynamic Carryover Addition</h1>

<div class="input-container">
    <label for="num1">Number 1:</label>
    <input type="number" id="num1" placeholder="Enter first number">
    <label for="num2">Number 2:</label>
    <input type="number" id="num2" placeholder="Enter second number">
    <button onclick="performAddition()">Add</button>
</div>

<div id="output"></div>

<script>
    function performAddition() {
        // Get input values
        const num1 = document.getElementById('num1').value;
        const num2 = document.getElementById('num2').value;

        // Validate inputs
        if (!num1 || !num2) {
            alert("Please enter both numbers.");
            return;
        }

        // Pad the shorter number with leading zeros
        const maxLength = Math.max(num1.length, num2.length);
        const paddedNum1 = num1.padStart(maxLength, '0');
        const paddedNum2 = num2.padStart(maxLength, '0');

        // Perform addition and track carryover
        let carryover = 0;
        let result = '';
        let carryoverDigits = Array(maxLength).fill(0); // Initialize carryover array
        let additionSteps = [];

        for (let i = maxLength - 1; i >= 0; i--) {
            const digit1 = parseInt(paddedNum1[i], 10);
            const digit2 = parseInt(paddedNum2[i], 10);
            const sum = digit1 + digit2 + carryover;
            const digitSum = sum % 10;
            carryover = Math.floor(sum / 10);
            carryoverDigits[i] = carryover; // Store carryover for current column
            result = digitSum.toString() + result;
            additionSteps.unshift({ digit1, digit2, carryover, digitSum });
        }

        if (carryover > 0) {
            result = carryover.toString() + result;
            carryoverDigits.unshift(carryover); // Add final carryover to the left
        }

        // Display the result
        displayAdditionSteps(paddedNum1, paddedNum2, carryoverDigits, additionSteps, result);
    }

    function displayAdditionSteps(num1, num2, carryoverDigits, additionSteps, result) {
        const output = document.getElementById('output');
        output.innerHTML = '';

        // Create the table
        const table = document.createElement('table');
        table.className = 'addition-table';

        // Add carryover row
        const carryoverRow = document.createElement('tr');
        carryoverRow.innerHTML = `<td></td>`;
        for (let i = 0; i < carryoverDigits.length; i++) {
            // Shift carryover one column to the right
            if (i === 0) {
                carryoverRow.innerHTML += `<td></td>`; // No carryover for the first column
            } else {
                carryoverRow.innerHTML += `<td class="carryover">${carryoverDigits[i]}</td>`;
            }
        }
        table.appendChild(carryoverRow);

        // Add first number row
        const num1Row = document.createElement('tr');
        num1Row.innerHTML = `<td></td>`;
        for (let digit of num1) {
            num1Row.innerHTML += `<td class="digit">${digit}</td>`;
        }
        table.appendChild(num1Row);

        // Add second number row
        const num2Row = document.createElement('tr');
        num2Row.innerHTML = `<td>+</td>`;
        for (let digit of num2) {
            num2Row.innerHTML += `<td class="digit">${digit}</td>`;
        }
        table.appendChild(num2Row);

        // Add horizontal line
        const lineRow = document.createElement('tr');
        lineRow.innerHTML = `<td colspan="${num1.length + 1}"><hr></td>`;
        table.appendChild(lineRow);

        // Add result row
        const resultRow = document.createElement('tr');
        resultRow.innerHTML = `<td></td>`;
        for (let digit of result) {
            resultRow.innerHTML += `<td class="digit">${digit}</td>`;
        }
        table.appendChild(resultRow);

        // Append table to output
        output.appendChild(table);

        // Display explanation
        const explanation = document.createElement('div');
        explanation.innerHTML = `
            <p><strong>Explanation:</strong></p>
            <ul>
                ${additionSteps.map((step, index) => `
                    <li>Column ${index + 1}: ${step.digit1} + ${step.digit2} + ${step.carryover} = ${step.digitSum} (Carryover: ${carryoverDigits[index]})</li>
                `).join('')}
            </ul>
            <p class="result">Final Result: ${result}</p>
        `;
        output.appendChild(explanation);
    }
</script>

</body>
</html>
